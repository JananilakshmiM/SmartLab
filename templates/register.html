<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLab - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe, #f0fdf4);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 450px;
            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;

            font-size: 30px;
            font-weight: bold;

            color: #0f766e;

            margin-bottom: 10px;
        }

        .title {
            text-align: center;

            font-size: 25px;

            color: #334155;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-weight: bold;
        }

        input,
        select {

            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {

            border-color: #0f766e;

            box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.1);
        }

        .register-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #0f766e;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }

        .register-btn:hover {
            background: #115e59;
        }

        .login-link {

            text-align: center;

            margin-top: 20px;

            color: #64748b;
        }

        .login-link a {

            color: #0f766e;

            font-weight: bold;

            text-decoration: none;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="logo">
            🧪 SmartLab
        </div>

        <div class="title">
            Create Your Account
        </div>


        <form method="POST" action="/register">


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- AGE -->

            <div class="form-group">

                <label>
                    Age
                </label>

                <input
                    type="number"
                    name="age"
                    placeholder="Enter your age"
                    min="1"
                    max="120"
                    required
                >

            </div>


            <!-- GENDER -->

            <div class="form-group">

                <label>
                    Gender
                </label>

                <select name="gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>


        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
